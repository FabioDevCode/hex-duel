# =============================================================================
# HEX DUEL — Production deployment (Docker Compose)
# =============================================================================
# Usage:
#   1. Create a .env file next to this one (see the variables below):
#        POSTGRES_PASSWORD=change_me_strong
#        SESSION_SECRET=change_me_long_random
#        # Public address of the machine, as the players' browsers reach it:
#        PUBLIC_WS_URL=ws://your-domain:2567
#        PUBLIC_API_URL=http://your-domain:2568
#        WEB_URL=http://your-domain:3000
#   2. Build and start everything:
#        docker compose -f compose.prod.yml up -d --build
#   3. Apply the database schema once (Drizzle):
#        docker compose -f compose.prod.yml exec server pnpm db:push
#
# Services:
#   postgres  - PostgreSQL 17 with a persistent volume
#   server    - Colyseus game server (WebSocket 2567 + matchmaking API 2568)
#   web       - Nuxt 4 application (port 3000)
#
# The browsers connect DIRECTLY to the WebSocket (2567) and the matchmaking
# API (2568): both ports must be reachable from the internet (open them in
# your firewall / reverse proxy), hence PUBLIC_WS_URL / PUBLIC_API_URL.
# =============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: hex_duel_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hex_duel}
      POSTGRES_USER: ${POSTGRES_USER:-hex_duel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hex_duel} -d ${POSTGRES_DB:-hex_duel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: only the server container talks to the database.
    expose:
      - "5432"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: hex_duel_server_prod
    restart: unless-stopped
    ports:
      # WebSocket (game rooms) and matchmaking API: the players' browsers
      # connect to both directly.
      - "2567:2567"
      - "2568:2568"
    environment:
      NODE_ENV: production
      SERVER_PORT: 2567
      API_PORT: 2568
      DATABASE_URL: postgresql://${POSTGRES_USER:-hex_duel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hex_duel}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # CORS: the public origin of the web app.
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Plain TCP connect to the Colyseus WebSocket port.
      test: ["CMD", "node", "-e", "require('node:net').connect(2567,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hex_duel_web_prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # Public runtime config, overridden at container start (NUXT_PUBLIC_*):
      # the addresses the BROWSERS use to reach the game server.
      NUXT_PUBLIC_SERVER_URL: ${PUBLIC_WS_URL:-ws://localhost:2567}
      NUXT_PUBLIC_MATCHMAKING_URL: ${PUBLIC_API_URL:-http://localhost:2568}
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
