services:
  postgres:
    image: postgres:17-alpine
    container_name: hex_duel_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hex_duel}
      POSTGRES_USER: ${POSTGRES_USER:-hex_duel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hex_duel} -d ${POSTGRES_DB:-hex_duel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port: only the server container talks to the database.
    expose:
      - "5432"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: hex_duel_server_prod
    restart: unless-stopped
    ports:
      # Bindés sur 127.0.0.1 uniquement : rien n'est exposé sur internet.
      # Caddy (sur l'hôte) proxifie wss://ws.<domaine> → 127.0.0.1:2567
      # et https://api.<domaine> → 127.0.0.1:2568.
      - "127.0.0.1:2567:2567"
      - "127.0.0.1:2568:2568"
    environment:
      NODE_ENV: production
      SERVER_PORT: 2567
      API_PORT: 2568
      DATABASE_URL: postgresql://${POSTGRES_USER:-hex_duel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hex_duel}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      # CORS: l'origine publique de l'app web (doit être en https:// en prod).
      WEB_URL: ${WEB_URL:-http://localhost:3333}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(2567,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hex_duel_web_prod
    restart: unless-stopped
    ports:
      # Bindé sur 127.0.0.1 uniquement : Caddy proxifie https://<domaine> → 127.0.0.1:3333
      - "127.0.0.1:3333:3333"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      # URLs publiques utilisées par les navigateurs (wss:// et https:// en prod).
      NUXT_PUBLIC_SERVER_URL: ${PUBLIC_WS_URL:-ws://localhost:2567}
      NUXT_PUBLIC_MATCHMAKING_URL: ${PUBLIC_API_URL:-http://localhost:2568}
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: