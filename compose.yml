
services:
  postgres:
    image: postgres:17
    container_name: hex_duel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hex_duel
      POSTGRES_USER: hex_duel
      POSTGRES_PASSWORD: hex_duel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hex_duel -d hex_duel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
